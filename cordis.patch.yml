# dsh-plan-toggle bundle patch —— 在 web-app 层之后插入一行 host 插件。
#
# 零侵入：不改官方任何文件。本行挂本包的 lib/index.js（package.json 的
# dsh.bundle.patch 指向本文件），由 dsh plugin --profile web add 自动并入
# profile 的 bundle 层栈。
#
# inject 的四个服务都是 web profile 里未禁用的 host 服务：
#   agentPresets  -> agent-presets（web-app 层），用来取 agent 自己的 planMode
#                    （plan-mode 由 preset 挂在 isolate realm，host ctx 取不到）
#   subagents     -> subagent（base 层）的 spawn provider，跑只读复核子代理
#   commands      -> commands（base 层），注册 /plan-toggle 与 /plan-review
#   sessionQuery  -> session-query-sqlite（base 层），读会话 surface 取计划草稿
#
# 刻意不 inject fs：归档改用 node:fs，避免耦合 fs-sandbox 的 workspace/策略状态。
#
# ── 硬拦截（plan 模式下的沙箱只读）────────────────────────────────────────────
# 插件在运行时软取三个服务并在进入 plan 模式时把沙箱切到只读：
#   permissionPresets（C 路线，首选）：挑一个 `sandbox: read-only` 的官方预设并 set()
#      —— 优先名为 `plan` 的预设，否则用官方自带的 `read-only`；预设表本身由部署方
#      拥有，本插件**不覆盖**它（这里的 patch 不写 permission 行，避免静默丢掉部署
#      自己加的预设）。想让它显示成 `plan`，在你自己的 profile patch 里加一个
#      `plan: { sandbox: read-only, approval: ask }` 即可，插件会自动优先选它。
#   sandboxPolicy（B 路线，兜底）：`setSandboxMode(session, 'read-only')`，官方导出
#      的写路径（permission-presets 内部同样调用它）。
#   approval：离开只读时还原审批策略（进入前不是预设时走直写）。
# 这三个服务缺失时插件自动降级为官方软提示词拦截，不会启动失败。

- insert:
    - id: plan-toggle
      name: dsh-plan-toggle
      inject: [agentPresets, subagents, commands, sessionQuery]
